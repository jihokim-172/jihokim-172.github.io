    <!--
      사진 추가 방법
      1) photos/연도/ (음식은 photos/food/) 폴더에 이미지를 넣는다.
      2) 해당 연도 section 의 gallery 안에 figure 블록을 추가한다. data-kind 는 "moment" 또는 "food".
      3) 새 연도는 #year-tabs 에 버튼을 하나 추가하고, section id="y연도" 를 위에 새로 만든다.

      <figure data-kind="moment">
        <a href="photos/2017/파일이름.jpg" target="_blank" rel="noopener"><img src="photos/2017/파일이름.jpg" alt="설명" loading="lazy"></a>
        <figcaption>캡션</figcaption>
      </figure>
    -->

    <script>
      (function () {
        var years = document.querySelectorAll('#year-tabs .chip');
        var kinds = document.querySelectorAll('#kind-tabs .chip');
        var year = years[0].dataset.year, kind = 'all';
        function render() {
          years.forEach(function (b) {
            var on = b.dataset.year === year;
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
            document.getElementById(b.dataset.year).hidden = !on;
          });
          kinds.forEach(function (b) {
            b.setAttribute('aria-pressed', b.dataset.kind === kind ? 'true' : 'false');
          });
          document.querySelectorAll('.year figure').forEach(function (f) {
            f.hidden = !(kind === 'all' || f.dataset.kind === kind);
          });
        }
        years.forEach(function (b) { b.addEventListener('click', function () { year = b.dataset.year; render(); }); });
        kinds.forEach(function (b) { b.addEventListener('click', function () { kind = b.dataset.kind; render(); }); });
        render();
      })();
    </script>
