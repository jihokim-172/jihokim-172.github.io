    <script>
      (function () {
        var kinds = document.querySelectorAll('#kind-tabs .chip');
        function render(kind) {
          kinds.forEach(function (b) {
            b.setAttribute('aria-pressed', b.dataset.kind === kind ? 'true' : 'false');
          });
          document.querySelectorAll('.year').forEach(function (sec) {
            var shown = 0;
            sec.querySelectorAll('figure').forEach(function (f) {
              var on = kind === 'all' || f.dataset.kind === kind;
              f.hidden = !on;
              if (on) shown++;
            });
            sec.hidden = shown === 0;
          });
        }
        kinds.forEach(function (b) { b.addEventListener('click', function () { render(b.dataset.kind); }); });
        render('all');
      })();
    </script>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
      <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
      <figure>
        <img alt="">
        <figcaption></figcaption>
      </figure>
      <button class="lb-btn lb-next" type="button" aria-label="Next photo">&#8250;</button>
    </div>

    <script>
      (function () {
        var box = document.getElementById('lightbox');
        var img = box.querySelector('img'), cap = box.querySelector('figcaption');
        var list = [], at = 0;
        function visible() {
          return Array.prototype.filter.call(document.querySelectorAll('.year figure'), function (f) {
            return !f.hidden && !f.closest('.year').hidden;
          });
        }
        function show(i) {
          at = (i + list.length) % list.length;
          var f = list[at];
          img.src = f.querySelector('a').href;
          img.alt = f.querySelector('img').alt;
          cap.textContent = f.querySelector('figcaption').textContent + '  (' + (at + 1) + ' / ' + list.length + ')';
        }
        function open(f) { list = visible(); box.hidden = false; document.body.style.overflow = 'hidden'; show(list.indexOf(f)); }
        function close() { box.hidden = true; document.body.style.overflow = ''; img.removeAttribute('src'); }
        document.querySelectorAll('.year figure a').forEach(function (a) {
          a.addEventListener('click', function (e) {
            if (e.ctrlKey || e.metaKey || e.shiftKey) return;
            e.preventDefault(); open(a.closest('figure'));
          });
        });
        box.querySelector('.lb-close').addEventListener('click', close);
        box.querySelector('.lb-prev').addEventListener('click', function () { show(at - 1); });
        box.querySelector('.lb-next').addEventListener('click', function () { show(at + 1); });
        box.addEventListener('click', function (e) { if (e.target === box) close(); });
        document.addEventListener('keydown', function (e) {
          if (box.hidden) return;
          if (e.key === 'Escape') close();
          else if (e.key === 'ArrowLeft') show(at - 1);
          else if (e.key === 'ArrowRight') show(at + 1);
        });
        var x0 = null;
        box.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
        box.addEventListener('touchend', function (e) {
          if (x0 === null) return;
          var dx = e.changedTouches[0].clientX - x0; x0 = null;
          if (Math.abs(dx) > 50) show(dx < 0 ? at + 1 : at - 1);
        });
      })();
    </script>
