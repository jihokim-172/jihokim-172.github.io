    <script>
      (function () {
        var kinds = document.querySelectorAll('#kind-tabs .chip');
        function render(kind) {
          kinds.forEach(function (b) {
            b.setAttribute('aria-pressed', b.dataset.kind === kind ? 'true' : 'false');
          });
          document.querySelectorAll('.year').forEach(function (sec) {
            var shown = 0;
            sec.querySelectorAll('figure').forEach(function (f) {
              var on = kind === 'all' || f.dataset.kind === kind;
              f.hidden = !on;
              if (on) shown++;
            });
            sec.hidden = shown === 0;
          });
        }
        kinds.forEach(function (b) { b.addEventListener('click', function () { render(b.dataset.kind); }); });
        render('all');
      })();
    </script>
